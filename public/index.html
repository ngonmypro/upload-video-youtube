<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Multi-Video Upload to Lambda</title>
    <link rel="stylesheet" href="https://www.w3schools.com/w3css/4/w3.css">
    <link rel="stylesheet" href="https://www.w3schools.com/lib/w3-theme-blue-grey.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css">
    <script src="https://cdn.jsdelivr.net/npm/keycloak-js@latest"></script>
    <style>
        html, body, h1, h2, h3, h4, h5 {font-family: "Open Sans", sans-serif}
        .video-list {
            margin: 20px 0;
        }
        .video-item {
            padding: 10px;
            border: 1px solid #ccc;
            margin-bottom: 10px;
            border-radius: 5px;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }
        .button-container {
            display: flex;
            justify-content: flex-end;
            position: fixed;
            bottom: 10px;
            right: 10px;
            z-index: 1000;
            background-color: white;
            padding: 10px;
            border-radius: 5px;
            box-shadow: 0px 0px 10px rgba(0, 0, 0, 0.1);
        }
        .center-container {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            flex-direction: column;
        }
        .w3-content {
            max-width: 800px;
            width: 100%;
        }
        .profile-container {
            display: flex;
            justify-content: flex-end;
            position: fixed;
            top: 5px;
            right: 10px;
            z-index: 100;
            background-color: white;
            padding: 10px;
            border-radius: 5px;
            box-shadow: 0px 0px 10px rgba(0, 0, 0, 0.1);
        }
        .profile-container #userDetails {
            margin: 8px;
        }
    </style>
</head>
<body class="w3-theme-l5">

<div class="center-container">
    <button type="submit" class="w3-button w3-theme-d1" id="loginButton">Login</button>
    <div id="userInfo">
        <div class="profile-container">
            <div id="userDetails"></div>
            <button type="submit" class="w3-button w3-theme-d1" id="logoutButton">Logout</button>
        </div>
    </div>
    <div class="w3-container w3-content w3-card w3-white w3-round" id="showVideoList">
        <h3 class="w3-center">Video List</h3>
        <form id="videoSelectionForm">
            <div id="videos" class="video-list"></div>
            <div class="button-container">
                <button type="submit" class="w3-button w3-theme-d1">Upload Selected Videos</button>
            </div>
        </form>
    </div>
</div>

<script>
showVideoList.hidden = true;
userInfo.hidden = true;
// สร้าง instance ของ Keycloak
var keycloak = new Keycloak({
    url: 'https://kc-auth-dev.bug-a-boo.tv', // URL ของ Keycloak server
    realm: 'bbtvnewmedia', // Realm ที่ตั้งค่าไว้
    clientId: 'shortseries-client' // Client ID ของแอป HTML
});

// ฟังก์ชันการทำงานหลังจาก Keycloak พร้อมทำงาน
keycloak.init({ onLoad: 'check-sso', flow: 'implicit' }).then(function(authenticated) {
    if (authenticated) {
        document.getElementById('loginButton').style.display = 'none';
        document.getElementById('logoutButton').style.display = 'inline';
        userInfo.hidden = false;

        keycloak.loadUserProfile().then(function(profile) {
            document.getElementById('userDetails').innerHTML = '<strong>Email:  </strong>' + profile.email;
            showVideoList.hidden = false;
            loadVideo();
        });
    } else {
        document.getElementById('loginButton').style.display = 'inline';
        document.getElementById('logoutButton').style.display = 'none';
        userInfo.hidden = true;
    }
}).catch(function() {
    alert('Please make sure you are logged in to access this page.');
});

// ฟังก์ชัน Login
document.getElementById('loginButton').onclick = function () {
    keycloak.login();
};

// ฟังก์ชัน Logout
document.getElementById('logoutButton').onclick = function () {
    keycloak.logout();
};

function loadVideo() {
    fetch('https://shortseries-hw.bugaboo.tv/static-api/meta_data_import.json')
        .then(response => response.json())
        .then(data => {
            let videos = data;

            function displayVideoList() {
                const videoList = document.getElementById('videos');
                videoList.innerHTML = '';

                videos.forEach((video, index) => {
                    const videoItem = document.createElement('div');
                    videoItem.className = 'video-item w3-card';
                    videoItem.innerHTML = `
                        <div>
                            <input type="checkbox" name="selectedVideos" value="${index}">
                            <strong>${video.title}</strong><br>
                            <small>EP ${video.ep} / ${video.total_ep}</small>
                        </div>
                        <img src="${video.thumbnail}" alt="${video.title}" style="width: 100px; height: auto;">
                    `;
                    videoList.appendChild(videoItem);
                });
            }

            displayVideoList();

            document.getElementById('videoSelectionForm').addEventListener('submit', function(event) {
                event.preventDefault();

                const selectedVideos = Array.from(document.querySelectorAll('input[name="selectedVideos"]:checked'))
                                        .map(checkbox => videos[checkbox.value]);

                if (selectedVideos.length > 0) {
                    const data = selectedVideos.map(video => ({
                        title: video.title,
                        url: video.externalStreamUrl,
                        thumbnail: video.thumbnail
                    }));
                    console.log(data);
                    fetch('https://your-lambda-endpoint.amazonaws.com/default/uploadVideos', {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/json',
                        },
                        body: JSON.stringify(data),
                    })
                    .then(response => response.json())
                    .then(data => {
                        console.log('Success:', data);
                        alert('Videos uploaded successfully!');
                    })
                    .catch(error => {
                        console.error('Error:', error);
                        alert('Failed to upload videos.');
                    });
                } else {
                    alert('Please select at least one video.');
                }
            });
        })
        .catch(error => console.error('Error fetching video data:', error));
}
</script>

</body>
</html>
